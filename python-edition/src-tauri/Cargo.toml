[package]
name = "reimbursement-manager"
version = "1.0.0"
description = "Reimbursement Manager — receipts to Excel via OCR"
edition = "2021"

[lib]
name = "reimbursement_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"

[profile.release]
codegen-units = 1
lto = true
